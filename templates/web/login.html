{% load static %}
<!doctype html>
<html lang="fr" data-theme="winter">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - PARKY</title>
    <link href="{% static 'web/css/app.css' %}" rel="stylesheet">
    <link href="{% static 'web/favicon.svg' %}" rel="icon" type="image/svg+xml">
  </head>
  <body class="login-shell min-h-screen" style="font-family: 'Segoe UI', Arial, ui-sans-serif, system-ui, sans-serif;">
    <main class="grid min-h-screen place-items-center px-4 py-10">
      <section class="w-full max-w-sm">
        <div class="mb-7 text-center">
          <img class="login-logo mx-auto h-16 w-16 object-contain p-2" src="{% static 'web/logo.svg' %}" alt="PARKY">
          <h1 class="mt-4 text-2xl font-bold text-black">PARKY</h1>
          <p class="mt-1 text-sm text-base-content/60">Connexion</p>
        </div>

        <div class="login-card p-5 sm:p-6">

          {% include "web/partials/messages.html" %}

          <form class="grid gap-4" method="post">
            {% csrf_token %}
            <label class="form-control">
              <span class="label"><span class="label-text">Nom d'utilisateur</span></span>
              <input class="input input-bordered bg-white" name="username" autocomplete="username" required autofocus>
            </label>
            <label class="form-control">
              <span class="label"><span class="label-text">Mot de passe</span></span>
              <input class="input input-bordered bg-white" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="btn btn-primary mt-1 w-full" type="submit">Connexion</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
