{% for link in nav_links %}
  {% if link.group == group %}
    {% if not link.admin_only or is_admin %}
      <a class="nav-link {% if active_page in link.url_name %}active{% endif %}" href="{% url link.url_name %}">
        <div class="sb-nav-link-icon"><i class="fa-solid {{ link.icon }}"></i></div>
        {{ link.label }}
      </a>
    {% endif %}
  {% endif %}
{% endfor %}
