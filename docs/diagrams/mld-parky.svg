<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .bg { fill: #f4f8fc; }
      .title { fill: #0f172a; font: 800 34px Segoe UI, Arial, sans-serif; }
      .subtitle { fill: #64748b; font: 500 16px Segoe UI, Arial, sans-serif; }
      .table { fill: #fff; stroke: #cbdced; stroke-width: 2; rx: 10; }
      .table-main { fill: #eef7ff; stroke: #123d6d; stroke-width: 2.5; rx: 10; }
      .thead { fill: #123d6d; }
      .thead-text { fill: #fff; font: 800 16px Segoe UI, Arial, sans-serif; }
      .row { fill: #0f172a; font: 500 13px Consolas, Segoe UI, Arial, sans-serif; }
      .pk { fill: #0f766e; font: 800 13px Consolas, Segoe UI, Arial, sans-serif; }
      .fk { fill: #1d4ed8; font: 800 13px Consolas, Segoe UI, Arial, sans-serif; }
      .link { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .link-soft { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .note { fill: #475569; font: 600 13px Segoe UI, Arial, sans-serif; }
      .legend { fill: #fff; stroke: #dbe5f0; stroke-width: 2; rx: 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text class="title" x="52" y="64">MLD - PARKY</text>
  <text class="subtitle" x="52" y="92">Modele logique relationnel extrait des modeles Django actuels</text>

  <rect class="legend" x="1120" y="36" width="410" height="82"/>
  <text class="pk" x="1145" y="68">PK</text><text class="note" x="1175" y="68">cle primaire</text>
  <text class="fk" x="1145" y="94">FK</text><text class="note" x="1175" y="94">cle etrangere</text>

  <g transform="translate(60 150)">
    <rect class="table" width="300" height="210"/>
    <rect class="thead" width="300" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">auth_user</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="row" x="18" y="96">username UNIQUE</text>
    <text class="row" x="18" y="122">password</text>
    <text class="row" x="18" y="148">email, first_name, last_name</text>
    <text class="row" x="18" y="174">is_active, is_superuser</text>
  </g>

  <g transform="translate(450 150)">
    <rect class="table" width="310" height="150"/>
    <rect class="thead" width="310" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">auth_user_groups</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="fk" x="18" y="96">FK user_id -> auth_user.id</text>
    <text class="fk" x="18" y="122">FK group_id -> auth_group.id</text>
  </g>

  <g transform="translate(850 150)">
    <rect class="table" width="280" height="120"/>
    <rect class="thead" width="280" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">auth_group</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="row" x="18" y="96">name UNIQUE (ADMIN, AGENT)</text>
  </g>

  <g transform="translate(60 455)">
    <rect class="table" width="340" height="190"/>
    <rect class="thead" width="340" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">vehicles_vehicletype</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="row" x="18" y="96">name UNIQUE</text>
    <text class="row" x="18" y="122">tarif_hours DECIMAL(10,2)</text>
    <text class="row" x="18" y="148">created_at</text>
    <text class="row" x="18" y="174">updated_at</text>
  </g>

  <g transform="translate(520 410)">
    <rect class="table-main" width="360" height="230"/>
    <rect class="thead" width="360" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">vehicles_vehicle</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="row" x="18" y="96">plaque UNIQUE</text>
    <text class="fk" x="18" y="122">FK vehicle_type_id -> vehicletype.id</text>
    <text class="row" x="18" y="148">marque</text>
    <text class="row" x="18" y="174">couleur</text>
    <text class="row" x="18" y="200">created_at, updated_at</text>
  </g>

  <g transform="translate(1000 410)">
    <rect class="table" width="330" height="160"/>
    <rect class="thead" width="330" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">vehicles_vehiclephoto</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="fk" x="18" y="96">FK vehicle_id -> vehicle.id</text>
    <text class="row" x="18" y="122">image</text>
    <text class="row" x="18" y="148">updated_at</text>
  </g>

  <g transform="translate(60 780)">
    <rect class="table" width="340" height="140"/>
    <rect class="thead" width="340" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">parkings_parkingzone</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="fk" x="18" y="96">FK vehicle_type_id -> vehicletype.id</text>
    <text class="row" x="18" y="122">name UNIQUE</text>
  </g>

  <g transform="translate(520 730)">
    <rect class="table-main" width="390" height="250"/>
    <rect class="thead" width="390" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">locations_location</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="row" x="18" y="96">code UNIQUE (jeton)</text>
    <text class="fk" x="18" y="122">FK vehicle_id -> vehicle.id</text>
    <text class="fk" x="18" y="148">FK parking_zone_id -> parkingzone.id NULL</text>
    <text class="row" x="18" y="174">nom_deposeur, telephone</text>
    <text class="row" x="18" y="200">heure_entree, heure_sortie</text>
    <text class="row" x="18" y="226">statut PARKED/EXITED/CANCELLED</text>
  </g>

  <g transform="translate(1030 735)">
    <rect class="table" width="390" height="235"/>
    <rect class="thead" width="390" height="42" rx="10"/>
    <text class="thead-text" x="18" y="27">payments_payment</text>
    <text class="pk" x="18" y="70">PK id</text>
    <text class="fk" x="18" y="96">FK UNIQUE location_id -> location.id</text>
    <text class="row" x="18" y="122">amount DECIMAL(12,2)</text>
    <text class="row" x="18" y="148">method CASH/ORANGE/MPESA/AIRTEL/ILLICO</text>
    <text class="row" x="18" y="174">payment_identifier</text>
    <text class="row" x="18" y="200">status, paid_at, created_at, updated_at</text>
  </g>

  <path class="link" d="M 360 245 L 450 225"/>
  <path class="link" d="M 760 225 L 850 210"/>

  <path class="link" d="M 400 550 L 520 525"/>
  <path class="link" d="M 400 600 C 440 710, 205 735, 230 780"/>
  <path class="link" d="M 880 525 L 1000 500"/>
  <path class="link" d="M 700 640 L 700 730"/>
  <path class="link" d="M 400 850 L 520 850"/>
  <path class="link" d="M 910 850 L 1030 850"/>

  <text class="note" x="60" y="1030">Index utiles: locations(statut), locations(vehicle, statut), locations(parking_zone, statut), locations(heure_entree), locations(heure_sortie), payments(status), payments(created_at), payments(paid_at).</text>
</svg>
